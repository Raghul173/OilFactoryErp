services:
  - type: web
    name: oilfactory-api
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set your TiDB / Aiven MySQL connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false # Set your Vercel Frontend URL (e.g. https://smartoil.vercel.app)
      - key: ADMIN_EMAIL
        value: raghuluma2006@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false # Optional Google OAuth Client ID
